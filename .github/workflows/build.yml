name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare libmpv
        shell: pwsh
        run: ./tools/setup-native.ps1
      - name: Build player without bundled .NET
        shell: pwsh
        run: ./tools/build.ps1 -OutputDirectory ./dist
      - name: Prepare installer compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .local -Force | Out-Null
          $download = Join-Path $PWD '.local/innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash $download).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Installer compiler hash mismatch' }
          $signature = Get-AuthenticodeSignature $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Installer compiler signature invalid' }
          $compiler = Join-Path $PWD '.local/inno'
          $process = Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="'+$compiler+'"'),'/NOICONS','/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer compiler setup failed' }
      - name: Build EXE installer
        shell: pwsh
        run: ./tools/build-installer.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: chilimusic-installer-x64
          path: release/
