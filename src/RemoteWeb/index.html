<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EDF3F7"><title>chilimusic · 手机遥控</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol><symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol><symbol id="icon-previous" viewBox="0 0 24 24"><path d="M5 5v14m14-14L8 12l11 7Z"/></symbol><symbol id="icon-next" viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7Z"/></symbol><symbol id="icon-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c6 0 6 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 3-1 4-3m4-6c1-2 2-3 4-3h3m-4-4 4 4-4 4"/></symbol><symbol id="icon-repeat" viewBox="0 0 24 24"><path d="M4 10V7a3 3 0 0 1 3-3h13m-4-3 4 3-4 3M20 14v3a3 3 0 0 1-3 3H4m4-3-4 3 4 3"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M3 12h18m-6-6 6 6-6 6"/></symbol><symbol id="icon-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol><symbol id="icon-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9Zm13 0 6 6m0-6-6 6"/></symbol><symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 20 3.5 11.5a5 5 0 0 1 7-7L12 6l1.5-1.5a5 5 0 0 1 7 7Z"/></symbol><symbol id="icon-note" viewBox="0 0 24 24"><path d="M9 17V6l11-3v11M9 6v4l11-3"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="15" rx="3" ry="2"/></symbol><symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="icon-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol><symbol id="icon-logout" viewBox="0 0 24 24"><path d="M10 3H4v18h6m4-9h7m-4-4 4 4-4 4"/></symbol>
</defs></svg>
<main class="shell">
<header><strong class="brand">chilimusic</strong><span id="connection" class="connection">未配对</span><button id="logout" class="icon" aria-label="断开并解除配对" title="断开并解除配对" hidden><svg><use href="#icon-logout"/></svg></button></header>
<section id="pair" class="pair card"><div class="pair-mark"><svg><use href="#icon-note"/></svg></div><h1>连接电脑</h1><p>在电脑端开启“手机遥控”，<br>输入电脑上显示的六位配对码。</p><form id="pair-form"><label for="code">配对码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><button id="pair-button" class="primary" type="submit">配对</button></form><p id="pair-error" class="form-error" role="alert"></p></section>
<div id="app" hidden>
<nav class="tabs" aria-label="页面"><button class="active" data-tab="player" aria-current="page">播放</button><button data-tab="queue">队列</button><button data-tab="library">曲库</button></nav>
<section id="player" class="page">
<div class="output card" role="group" aria-label="播放设备"><button id="computer-output" class="active" aria-pressed="true">电脑播放</button><button id="phone-output" aria-pressed="false">手机播放</button></div>
<button id="lyrics-toggle" class="text-button lyrics-toggle" aria-pressed="false">歌词</button><div class="artwork" id="artwork" tabindex="0" role="button" aria-label="点击封面查看歌词"><img id="cover" alt="当前歌曲封面" hidden><div id="cover-empty"><svg><use href="#icon-note"/></svg></div></div>
<section id="phone-lyrics" hidden><div class="lyrics-controls"><span id="lyrics-status" class="muted">暂无歌词</span><label><input type="checkbox" id="lyrics-translation" checked> 翻译</label></div><div id="lyrics-lines" class="lyrics-lines" aria-label="同步歌词"></div><button id="lyrics-follow" class="text-button" hidden>回到正在播放</button></section><div class="song-heading"><div><h1 id="title">尚未播放</h1><p id="artist">从曲库选择一首歌曲</p></div><button id="favorite" class="icon" aria-label="收藏" title="收藏"><svg><use href="#icon-heart"/></svg></button></div>
<label class="sr-only" for="seek">播放进度</label><input id="seek" class="range" type="range" min="0" max="1" step="0.1" value="0"><div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
<div class="play-controls"><button id="shuffle-button" class="icon" aria-label="切换随机播放"><svg><use href="#icon-shuffle"/></svg></button><button data-action="previous" class="icon" aria-label="上一首"><svg><use href="#icon-previous"/></svg></button><button id="play-button" class="play-button" aria-label="播放"><svg><use href="#icon-play"/></svg></button><button data-action="next" class="icon" aria-label="下一首"><svg><use href="#icon-next"/></svg></button><button id="mode" class="icon mode" aria-label="顺序播放"><svg><use href="#icon-arrow"/></svg><small id="repeat-one" hidden>1</small></button></div>
<div class="volume"><button id="mute" class="icon" aria-label="静音"><svg><use href="#icon-volume"/></svg></button><label class="sr-only" for="volume">音量</label><input id="volume" class="range" type="range" min="0" max="100" step="1" value="80"><output id="volume-value">80</output></div>
<section class="card next-card"><div class="section-heading"><h2>接下来</h2><button id="show-queue" class="text-button">全部队列</button></div><div id="next-list" class="song-list"></div></section>
<p id="output-hint" class="footnote">音乐由电脑播放</p>
</section>
<section id="queue" class="page" hidden><div class="section-heading"><h1>播放队列</h1><span id="queue-count" class="muted">0 首</span></div><div id="queue-list" class="card song-list"></div><button id="queue-more" class="load-more" hidden>加载更多</button></section>
<section id="library" class="page" hidden><form id="search-form" class="search-row"><label class="sr-only" for="search">搜索歌曲、歌手或专辑</label><input id="search" placeholder="搜索歌曲、歌手、专辑" type="search" maxlength="120"><button class="primary" type="submit">搜索</button></form><div class="library-heading"><label class="sr-only" for="source">音乐来源</label><select id="source"><option value="server">Navidrome</option><option value="netease">网易云音乐</option><option value="local">本地音乐</option><option value="offline">离线音乐</option><option value="favorite">本地收藏</option></select><button id="album-back" class="text-button" hidden>返回曲库</button></div><label class="sr-only" for="library-view">曲库分类</label><select id="library-view" class="library-view"><option value="newest">最近添加</option><option value="recent">最近播放</option><option value="favorites">网易云收藏</option><option value="daily">网易云每日推荐</option></select><h2 id="library-title">最近添加</h2><div id="library-list" class="card song-list"></div><button id="library-more" class="load-more" hidden>加载更多</button></section>
<footer><span id="theme-name"></span><span>chilimusic</span></footer>
</div>
</main><div id="toast" role="status" hidden></div><audio id="audio" preload="metadata"></audio>
</body></html>
