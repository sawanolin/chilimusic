name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare libmpv
        shell: pwsh
        run: ./tools/setup-native.ps1
      - name: Build player without bundled .NET
        shell: pwsh
        run: ./tools/build.ps1 -OutputDirectory ./dist
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: chilimusic-win-x64
          path: dist/
